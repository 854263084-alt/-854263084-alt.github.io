name: Record ChainPulse radar data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radar-record.yml'
      - '.github/scripts/record-radar.mjs'
      - 'data/radar-history.json'
  schedule:
    # 避开整点，降低公共数据源拥堵；GitHub 的定时任务可能有延迟。
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: chainpulse-radar-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public market snapshots
        run: node .github/scripts/record-radar.mjs
      - name: Commit updated snapshot when data changed
        run: |
          if git diff --quiet -- data/radar-history.json; then
            echo "No verified snapshot change to commit."
            exit 0
          fi
          git config user.name "chainpulse-radar[bot]"
          git config user.email "chainpulse-radar[bot]@users.noreply.github.com"
          git add data/radar-history.json
          git commit -m "chore: record market radar snapshot"
          git push
